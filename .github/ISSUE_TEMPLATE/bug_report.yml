name: Bug report
description: Wrong numbers, a crash, or something that looks broken in the app
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw and what you expected. For a wrong number, say why you expected a different one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A page URL with its parameters (map, seed, run), a CLI command line, or a map JSON file.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `lidar-slam-lab --version`, or the commit hash.
  - type: input
    id: environment
    attributes:
      label: Browser or Node version, and OS
